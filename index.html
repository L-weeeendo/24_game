<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>24点</title>
</head>
<style>
    body {
        background: #82ddff;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        user-select: none;
        height: 100vh;
    }
    .num {
        width: 190px;
        height: 190px;
        line-height: 190px;
        font-size: 90px;
        transition: all 0.2s ease;
    }
    .num:hover {
        background: #fdfdbe;
    }
    .bod {
        position: relative;
        width: 400px;
        height: 400px;
        border-radius: 20px;
        padding: 20px;
        background: antiquewhite;
        border: 5px solid #d6c6b3;
        display: flex;
        justify-content: center;
        margin-bottom: 7px;
    }
    .maths {
        width: 400px;
        height: 100px;
        border-radius: 20px;
        padding: 20px;
        background: antiquewhite;
        border: 5px solid #d6c6b3;
        display: flex;
    }
    .ms {
        width: 100px;
        height: 100px;
        line-height: 100px;
        font-size: 50px;
        transition: all 0.2s cubic-bezier(0, 0.66, 0, 1.64);
    }
    .ms:hover {
        width: 120px;
    }
    .ms:active {
        width: 80px;
    }
    .tools {
        width: 400px;
        height: 50px;
        border-radius: 20px;
        padding: 20px;
        background: antiquewhite;
        border: 5px solid #d6c6b3;
        display: flex;
        margin-top: 7px;
    }
    .tos {
        height: 50px;
        line-height: 50px;
        font-size: 30px;
        transition: all 0.2s cubic-bezier(0, 0.66, 0, 1.64);
    }
    .b:hover {
        width: 220px;
    }
    .b:active {
        width: 180px;
    }
    .pts {
        width: 50px;
    }
    .b {
        width: 175px;
    }
    .tip {
        position: absolute;
        opacity: 0;
        bottom: 0;
        font-size: 40px;
        color: darkgreen;
        transition: all 0.2s ease;
        text-align: center;
        text-shadow: 0 0 4px black;
    }
    .a-s {
        background: beige;
        border-radius: 10px;
        border: 5px solid #d1d1bb;
        font-weight: 600;
        color: #aca08d;
        text-align: center;
    }
</style>
<body>
<div class="bod">
    <div>
        <div class="n1 num a-s" onclick="slt_elt('n1')">1</div>
        <div class="n2 num a-s" onclick="slt_elt('n2')">2</div>
    </div>
    <div>
        <div class="n3 num a-s" onclick="slt_elt('n3')">3</div>
        <div class="n4 num a-s" onclick="slt_elt('n4')">4</div>
    </div>
    <p class="tip"></p>
</div>
<div class="maths">
    <div class="add ms a-s" onclick="ms='a'">+</div>
    <div class="out ms a-s" onclick="ms='b'">-</div>
    <div class="chg ms a-s" onclick="ms='c'">×</div>
    <div class="bie ms a-s" onclick="ms='d'">÷</div>
</div>
<div class="tools">
    <div class="pts tos a-s">0</div>
    <div class="ret tos b a-s" onclick="show()">重来</div>
    <div class="nxt tos b a-s" onclick="mak_nums()">下一关</div>
</div>
</body>
<script>
    const n1 = document.querySelector(".n1")
    const n2 = document.querySelector(".n2")
    const n3 = document.querySelector(".n3")
    const n4 = document.querySelector(".n4")
    const pts = document.querySelector(".pts")
    const tip = document.querySelector(".tip")
    let point = 0
    let slt_a = ""
    let slt_b = ""
    let ms = ""
    let list = []
    let can_nxt = false
    mak_nums()
    function randoms(a,b){return Math.floor(Math.random()*(b-a)+a)}
    function show(){
        n1.style = ""
        n2.style = ""
        n3.style = ""
        n4.style = ""
        n1.textContent = list[0]
        n2.textContent = list[1]
        n3.textContent = list[2]
        n4.textContent = list[3]
        tip.style = ""
        slt_a = ""
        slt_b = ""
        ms = ""
        if (can_nxt){
            point = point - 1
            pts.textContent = String(point)
        }
        can_nxt = false
    }
    function mak_nums(){
        let num_ok = false
        list = []
        can_nxt = false
        let ts = 0
        while (!num_ok && ts <= 1000){
            ts++
            let a = one_t(24)
            list.push(a[0])
            list.push(a[1])
            for (let i=1;i<=2;i++) {
                let v = randoms(0, list.length - 1)
                for (let b=0;b<list.length;b++){
                    if (list[b]>10 || list[b]<1){
                        v = b
                    }
                }
                a = one_t(list[v])
                list.splice(v, 1)
                list.push(a[0])
                list.push(a[1])
            }
            let o = true
            for (let i of list){
                if (i>10 || i<1){
                    o = false
                }
            }
            num_ok = o
        } for (let i=0;i<4;i++){
            if (list[i]>10 || list[i]<1){
                list[i] = randoms(1, 10)
            }
        }
        console.log(list)
        show()
    }
    function one_t(a){
        let v = randoms(1, 4)
        let b = randoms(1, 5)
        let c = 0
        if (a <= 0){
            v = 1
        } else if (a > 10 && a <= 20){
            v = 3
        } else if (a > 20){
            v = 4
        }

        if (v === 1){
            c = a + b
        } else if (v === 3){
            c = a - b
            if (c < 0){
                c = 0 - c
                b = a - c
            }
        } else if (v === 2){
            c = a * b
        } else {
            let inb = []
            for (let i = 1; i <= Math.floor(a / 2)+1; i++){
                let d = a / i
                if (Number.isInteger(d)){
                    inb.push(d, i)
                }
            }
            if (inb.length===0){
                return one_t(a)
            }
            b = inb[randoms(0, inb.length-1)]
            c = a / b
        }
        return [b, c]
    }
    function turn(a){
        if (a === 'n1'){
            return n1
        } else if (a === 'n2'){
            return n2
        } else if (a === 'n3'){
            return n3
        } else if (a === 'n4'){
            return n4
        }
    }
    function slt_elt(a){
        if (turn(a).style.opacity==="0"){return}
        if (slt_a===""){
            slt_a = turn(a)
            slt_b = ""
            slt_a.style.background = "#95958b"
        } else if (slt_a!==turn(a)){
            slt_b = turn(a)
            if (Number(slt_b.textContent)===0 && ms==="d"){
                tip.textContent = "0不能做除数哦！"
                tip.style.color = "darkred"
                tip.style.opacity = "1"
                setTimeout(()=>{
                    tip.style = ""
                    slt_b = ""
                }, 1000)
                return;
            }
            let b = Number(slt_a.textContent)
            let c = Number(slt_b.textContent)
            let d = 0
            if (ms===""){
                slt_a.style.background = ""
                slt_a = ""
                return;
            } else if (ms==='a'){
                d = b + c
            } else if (ms==='b'){
                d = b - c
            } else if (ms==='c'){
                d = b * c
            } else if (ms==='d'){
                d = b / c
            }
            slt_b.textContent = String(d)
            slt_a.textContent = "f"
            slt_a.style.opacity = "0"
            let list = [n1.textContent,
            n2.textContent,
            n3.textContent,
            n4.textContent]
            let f = 0
            let n = 0
            let y = 0
            for (let i of list){
                if (i === "f"){
                    f++
                } else if (i === "24"){
                    y++
                } else {
                    n++
                }
            } if (f === 3){
                if (y === 1){
                    point++
                    slt_b.style.background = "green"
                    pts.textContent = String(point)
                    tip.textContent = "恭喜！"
                    can_nxt = true
                } else if (n === 1){
                    slt_b.style.background = "red"
                    tip.textContent = "要等于24哦！"
                    tip.style.color = "darkred"
                }
                tip.style.opacity = "1"
            }
            slt_b = ""
            slt_a = ""
            ms = ""
        }
    }
</script>
</html>
