<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>24点</title>
    <link rel="icon" href="./logo.svg">
</head>
<style>
    body {
        background: #82ddff;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        user-select: none;
        height: 100vh;
        width: 100vw;
        margin: 0;
        padding: 0;
    }
    .num {
        width: 190px;
        height: 190px;
        line-height: 190px;
        font-size: 90px;
        transition: background 0.1s ease,
        opacity 0.1s ease,
        top 3s cubic-bezier(1, 1.36, 0.73, 1.15),
        left 3s cubic-bezier(1, 1.36, 0.73, 1.15);
    }
    .num:hover {
        background: #fdfdbe;
    }
    .bod {
        position: relative;
        width: 400px;
        height: 400px;
        border-radius: 20px;
        padding: 20px;
        background: antiquewhite;
        border: 5px solid #d6c6b3;
        display: flex;
        justify-content: center;
        margin-bottom: 7px;
        flex-wrap: wrap;
    }
    .maths {
        width: 400px;
        height: 100px;
        border-radius: 20px;
        padding: 20px;
        background: antiquewhite;
        border: 5px solid #d6c6b3;
        display: flex;
    }
    .ms {
        width: 100px;
        height: 100px;
        line-height: 100px;
        font-size: 50px;
        transition: all 0.2s cubic-bezier(0, 0.66, 0, 1.64);
    }
    .ms:hover {
        width: 120px;
    }
    .ms:active {
        width: 80px;
    }
    .tools {
        width: 400px;
        height: 50px;
        border-radius: 20px;
        padding: 20px;
        background: antiquewhite;
        border: 5px solid #d6c6b3;
        display: flex;
        margin-top: 7px;
    }
    .tos {
        height: 50px;
        line-height: 50px;
        font-size: 30px;
        transition: all 0.2s cubic-bezier(0, 0.66, 0, 1.64);
    }
    .b:hover {
        width: 220px;
    }
    .b:active {
        width: 180px;
    }
    .pts {
        width: 50px;
    }
    .b {
        width: 175px;
    }
    .tip {
        display: none;
        width: 100%;
        height: auto;
        background: #e2ffeb;
        position: absolute;
        opacity: 0;
        bottom: 0;
        font-size: 40px;
        color: darkgreen;
        transition: all 0.2s ease;
        text-align: center;
    }
    .a-s {
        background: beige;
        border-radius: 10px;
        border: 5px solid #d1d1bb;
        font-weight: 600;
        color: #aca08d;
        text-align: center;
    }
    .logo {
        background-image: url("./logo.svg");
        height: 15px;
        width: 15px;
        border-radius: 2px;
        background-size: cover;
    }
    .inf {
        position: absolute;
        top: 0;
        left: 16px;
        font-size: 15px;
        margin: 0;
    }
    .infontop {
        display: flex;
        flex-direction: row;
        position: absolute;
        top: 0;
        left: 0;
        padding: 0;
        height: 15px;
        width: 100%;
        background: #e2ffeb;
    }
</style>
<body>
<div class="infontop">
    <div class="logo"></div>
    <div class="inf">用加减乘除算出<strong>24</strong></div>
</div>
<div class="bod">
    <div class="n1 num a-s" onclick="slt_elt('n1')">1</div>
    <div class="n2 num a-s" onclick="slt_elt('n2')">2</div>
    <div class="n3 num a-s" onclick="slt_elt('n3')">3</div>
    <div class="n4 num a-s" onclick="slt_elt('n4')">4</div>
    <p class="tip"></p>
</div>
<div class="maths">
    <div class="add ms a-s" onclick="ms='a'">+</div>
    <div class="out ms a-s" onclick="ms='b'">-</div>
    <div class="chg ms a-s" onclick="ms='c'">×</div>
    <div class="bie ms a-s" onclick="ms='d'">÷</div>
</div>
<div class="tools">
    <div class="pts tos a-s">0</div>
    <div class="ret tos b a-s" onclick="show()">重来</div>
    <div class="nxt tos b a-s" onclick="mak_nums()">下一关</div>
</div>
</body>
<script>
    const n1 = document.querySelector(".n1")
    const n2 = document.querySelector(".n2")
    const n3 = document.querySelector(".n3")
    const n4 = document.querySelector(".n4")
    const pts = document.querySelector(".pts")
    const tip = document.querySelector(".tip")
    const delany = (l,n) => {
        return l.filter(i => {
            let r = true
            if (i === n && r) {
                r = false
                return false
            }
            return true
        })
    }
    let point = 0
    let slt_a = ""
    let slt_b = ""
    let ms = ""
    let list = []
    let can_nxt = false
    mak_nums()
    function randoms(a,b){return Math.floor(Math.random()*(b-a)+a)}
    function show(){
        [n1,n2,n3,n4].forEach(e => {
            e.style = ""
        })
        n1.textContent = list[0]
        n2.textContent = list[1]
        n3.textContent = list[2]
        n4.textContent = list[3]
        tip.style = ""
        slt_a = ""
        slt_b = ""
        ms = ""
        if (can_nxt){
            pts.textContent = String(--point)
        }
        can_nxt = false
    }
    function mak_nums(){
        list = []
        for(let i=0;i<4;i++){
            list.push(randoms(1,10))
        }
        while (!find_end()){
            list = []
            for(let i=0;i<4;i++){
                list.push(randoms(1,10))
            }
        }
        can_nxt = false
        show()
    }
    function find_end(){
        for (let i of list){
            let a = i
            let v1 = delany(list,i)
            for (let i1 of v1){
                let v2 = delany(v1,i1)
                for (let m1 of [1,2,3,4]){
                    a = mths(a,i1,m1)
                    if (!a){continue}
                    for (let i2 of v2){
                        let v3 = delany(v2,i2)
                        for (let m2 of [1,2,3,4]){
                            a = mths(a,i2,m2)
                            if (!a){continue}
                            for (let i3 of v3){
                                for (let m3 of [1,2,3,4]){
                                    a = mths(a,i3,m3)
                                    if (!a){continue}
                                    if (a === 24){
                                        console.log(true)
                                        return true
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
        console.log(false)
        return false
    }
    function mths(w,x,m){
        if (m === 4 && x === 0){
            return false
        }
        if (m === 1){
            console.log(w + x)
            return w + x
        } else if (m === 2){
            console.log(w - x)
            return w - x
        } else if (m === 3){
            console.log(w * x)
            return m * x
        } else if (m === 4){
            console.log(w / x)
            return m / x
        }
    }
    function turn(a){
        if (a === 'n1'){
            return n1
        } else if (a === 'n2'){
            return n2
        } else if (a === 'n3'){
            return n3
        } else if (a === 'n4'){
            return n4
        }
    }
    function slt_elt(a){
        if (turn(a).style.opacity==="0"){return}
        if (slt_a===""){
            slt_a = turn(a)
            slt_b = ""
            slt_a.style.background = "#78d3c2"
        } else if (slt_a!==turn(a)){
            slt_b = turn(a)
            if (Number(slt_b.textContent)===0 && ms==="d"){
                tip.textContent = "0不能做除数哦"
                tip.style.display = "block"
                tip.style.color = "darkred"
                tip.style.opacity = "1"
                setTimeout(()=>{
                    tip.style = ""
                    slt_b = ""
                }, 1000)
                return;
            }
            let b = Number(slt_a.textContent)
            let c = Number(slt_b.textContent)
            let d = 0
            if (ms===""){
                slt_a.style.background = ""
                slt_a = ""
                return;
            } else if (ms==='a'){
                d = b + c
            } else if (ms==='b'){
                d = b - c
            } else if (ms==='c'){
                d = b * c
            } else if (ms==='d'){
                d = b / c
            }
            slt_b.textContent = String(d)
            slt_a.textContent = ""
            slt_a.style.opacity = "0"
            let list = [n1.textContent,
            n2.textContent,
            n3.textContent,
            n4.textContent]
            let f = 0
            let n = 0
            let y = 0
            for (let i of list){
                if (i === ""){
                    f++
                } else if (i === "24"){
                    y++
                } else {
                    n++
                }
            } if (f === 3){
                slt_b.style.position = "absolute"
                slt_b.style.top = "50%"
                slt_b.style.left = "50%"
                slt_b.style.transform = "translate(-50%, -50%)"
                slt_b.style.margin = "0"
                tip.style.display = "block"
                if (y === 1){
                    slt_b.style.background = "green"
                    pts.textContent = String(++point)
                    tip.textContent = "恭喜"
                    can_nxt = true
                } else if (n === 1){
                    slt_b.style.background = "red"
                    tip.textContent = "要等于24哦"
                    tip.style.color = "darkred"
                }
                tip.style.opacity = "1"
            }
            slt_b = ""
            slt_a = ""
            ms = ""
        }
    }
</script>
</html>
